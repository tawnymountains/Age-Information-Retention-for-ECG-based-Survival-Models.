[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-age-retention"
version = "0.2.0"
description = "Age-information retention and subgroup-risk auditing for frozen ECG representations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zijian Zhao"}, {name = "Zihuai Lin"}, {name = "Gaoyang Pang"}, {name = "Branka Vucetic"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7,<4"]
survival = ["scikit-survival>=0.22,<0.28"]
training-example = ["torch>=2.1,<3"]

[project.urls]
Repository = "https://github.com/tawnymountains/ecg-age-retention"

[tool.setuptools.packages.find]
where = ["src"]
